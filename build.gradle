plugins {
	id 'java'
}

repositories {
	mavenLocal()
	maven {
		url = 'https://repo.runelite.net'
		content {
			includeGroupByRegex("net\\.runelite.*")
		}
	}
	mavenCentral()
}

def runeLiteVersion = 'latest.release'
def pluginMainClass = 'com.grinder.GrinderPluginTest'

dependencies {
	compileOnly group: 'net.runelite', name:'client', version: runeLiteVersion

	compileOnly 'org.projectlombok:lombok:1.18.38'
	annotationProcessor 'org.projectlombok:lombok:1.18.38'

	testImplementation 'junit:junit:4.12'
	testImplementation group: 'net.runelite', name:'client', version: runeLiteVersion
	testImplementation group: 'net.runelite', name:'jshell', version: runeLiteVersion
}

group = 'com.grinder'

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release.set(11)
}

test {
    systemProperty 'user.home', layout.buildDirectory.dir('test-home').get().asFile.absolutePath
}

tasks.register('checkPluginCompliance') {
    doLast {
        def forbidden = [
            'constructing Gson instead of injection': /new\s+Gson(?:Builder)?\s*\(/,
            'raw filesystem access': /\b(?:Files|Paths)\s*\.|java\.io\.(?:File|FileInputStream|FileOutputStream|FileReader|FileWriter|RandomAccessFile)\b/,
            'unrestricted Filepath access': /Filepath\.Unchecked/,
            'reflection': /java\.lang\.reflect|Class\.forName\s*\(/,
            'external processes or native loading': /ProcessBuilder|Runtime\.getRuntime|System\.load(?:Library)?\s*\(/,
            'sleep or interrupt': /Thread\.sleep\s*\(|\.interrupt\s*\(|\.cancel\s*\(\s*true\s*\)/,
            'unapproved network client': /HttpURLConnection|java\.net\.http|new\s+OkHttpClient\s*\(/,
            'game input or server action injection': /\b(?:Robot|ClientPacket|ServerSocket)\b|\.menuAction\s*\(|\.invokeMenuAction\s*\(|\.dispatchEvent\s*\(/,
            'unsupported file chooser': /JFileChooser/,
            'unsafe native access': /sun\.misc\.Unsafe|com\.sun\.jna|org\.lwjgl/
        ]
        fileTree('src/main/java').matching { include '**/*.java' }.each { source ->
            forbidden.each { label, pattern ->
                if (source.getText('UTF-8') =~ pattern) {
                    throw new GradleException("Plugin compliance check: ${label} in ${source}")
                }
            }
        }
    }
}

check.dependsOn tasks.named('checkPluginCompliance')

tasks.register('run', JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = pluginMainClass

	jvmArgs "-ea"
	args "--developer-mode", "--debug"
}

tasks.register('shadowJar', Jar) {
	dependsOn configurations.testRuntimeClasspath
	manifest {
		attributes('Main-Class': pluginMainClass, 'Multi-Release': true)
	}

	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	from sourceSets.main.output
	from sourceSets.test.output
	from {
		configurations.testRuntimeClasspath.collect { file ->
			file.isDirectory() ? file : zipTree(file)
		}
	}

	exclude 'META-INF/INDEX.LIST'
	exclude 'META-INF/*.SF'
	exclude 'META-INF/*.DSA'
	exclude 'META-INF/*.RSA'
	exclude '**/module-info.class'

	group = BasePlugin.BUILD_GROUP
	archiveClassifier.set('shadow')
	archiveFileName.set("${rootProject.name}-${project.version}-all.jar")
}
